# Peach Basket — production CI
# Runs on every push and pull request to main. Does not deploy.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI builds database-backed pages against the disposable PostgreSQL service below.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/peach_basket_ci?schema=public
  DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/peach_basket_ci?schema=public
  PORTAL_SESSION_SECRET: ci-portal-session-secret-do-not-use-in-production
  CRON_SECRET: ci-cron-secret-do-not-use-in-production
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: peach_basket_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d peach_basket_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Apply CI database schema
        run: npx prisma db push --skip-generate

      - name: Seed CI formula metadata
        run: npx tsx scripts/ci-seed-formula-version.ts

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'prisma/**', 'next.config.mjs', 'tsconfig.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build
